services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d research_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - research-agent-postgres:/var/lib/postgresql/data

volumes:
  research-agent-postgres:


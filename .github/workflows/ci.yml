name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: research_agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d research_agent_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: PostgreSQL concurrent-worker integration
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://agent:agent_ci_only@localhost:5432/research_agent_test
        run: pytest tests/test_postgres_integration.py -q
      - name: Deterministic smoke run
        run: |
          research-agent --database-url sqlite:///ci-demo.db demo seed --companies 5
          research-agent --database-url sqlite:///ci-demo.db run --mode fixture --log-path ""
          research-agent --database-url sqlite:///ci-demo.db export ci-results.json
          python -c "import json; assert len(json.load(open('ci-results.json'))) == 75"
